# docs/android.md A-32, A-33: pushing a tag v<version> publishes a signed APK.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches appVersionName
        run: |
          version=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appVersionName $version" >&2
            exit 1
          fi

      - name: Restore the keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing: run scripts/create-release-key.sh" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Test and build the signed APK
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Write the release notes
        run: |
          apk="hexchain-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          # "Signer #1 certificate SHA-256 digest: …" (build-tools 36) or
          # "V2 Signer: certificate SHA-256 digest: …" (37); shown as AB:CD:… like keytool.
          digest=$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          [ -n "$digest" ] || { echo "Could not read the signing certificate" >&2; exit 1; }
          printf 'Signing certificate SHA-256: `%s`\n' "$digest" > notes.md
          cat notes.md

      - name: Publish the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" "hexchain-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            android/hexchain-${{ github.ref_name }}.apk
            android/notes.md

  # docs/release.md section 5: mirror the release to Gitee for users in China.
  # Runs only when the repository variable GITEE_REPO is set.
  gitee:
    needs: release
    if: vars.GITEE_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish the Gitee Release
        run: |
          scripts/publish-gitee.sh "$GITHUB_REF_NAME" \
            "release/hexchain-${GITHUB_REF_NAME}.apk" release/notes.md
        env:
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
